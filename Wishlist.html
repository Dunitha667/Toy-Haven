<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Haven | Wishlist</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
  <link rel="stylesheet" href="Wishlist.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="images/logo.png" alt="Toy Haven Logo">
      </a>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="Product-Listing.html">Products</a>
      <a href="Shopping-Cart.html">Cart</a>
      <a href="Wishlist.html" class="active">Wishlist</a>
      <a href="Feedback.html">Support</a>
    </nav>
    <button type="button" class="hamburger" id="hamburger" aria-label="Toggle Navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <main class="wishlist-main">
    <h1>My Wishlist & Collection</h1>
    
    <!-- Filter Status Controls -->
    <section class="wishlist-controls" aria-label="Wishlist Filters">
      <label for="statusFilter">Filter Status:</label>
      <select id="statusFilter">
        <option value="All">All Items</option>
        <option value="Interested">Interested</option>
        <option value="Owned">Owned</option>
        <option value="Not Interested">Not Interested</option>
      </select>
    </section>

    <!-- Wishlist Grid Container -->
    <section class="wishlist-section" aria-label="Wishlist Items">
      <div class="wishlist-grid" id="wishlistGrid">
        <!-- Dynamically populated via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-links">
        <h2>Quick Links</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="Product-Listing.html">Products</a></li>
          <li><a href="Shopping-Cart.html">Cart</a></li>
          <li><a href="Wishlist.html">Wishlist</a></li>
          <li><a href="Feedback.html">Support</a></li>
        </ul>
      </div>

      <div class="footer-newsletter">
        <h2>Subscribe to Newsletter</h2>
        <form id="newsletterForm">
          <label for="newsletterEmail" class="visually-hidden">Email Address</label>
          <input type="email" id="newsletterEmail" placeholder="Enter your email" required>
          <button type="submit" class="btn">Subscribe</button>
        </form>
        <p id="newsletterMsg"></p>
      </div>
    </div>
    <p class="copyright">&copy; 2026 Toy Haven. All rights reserved.</p>
  </footer>

  <script src="Wishlist.js"></script>
</body>
</html>
